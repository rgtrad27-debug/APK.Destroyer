name: Build APK - Mauricio Financas

on:
  workflow_dispatch:
  push:
    branches: [mauricio-financas-ajustes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('mauricio-financas.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Prepare Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp mauricio-financas.html www/index.html
          npx cap init "Maurício Finanças" com.mauricio.financas --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 33/' android/variables.gradle

      - name: Apply the exact Mauricio icon to legacy AND Android adaptive launchers
        run: |
          test -f mauricio-financas-3d-96.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open('mauricio-financas-3d-96.png').convert('RGBA')
          base = Path('android/app/src/main/res')
          # Legacy launcher resources: use the full supplied artwork.
          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, size in sizes.items():
              folder = base / f'mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(folder/'ic_launcher.png', optimize=True)
              source.resize((size,size), Image.Resampling.LANCZOS).save(folder/'ic_launcher_round.png', optimize=True)
          # Android 8+ and Android 13+ use adaptive icons, not the legacy PNGs.
          # Put the complete artwork inside the 2/3 safe zone, centered, so Android's
          # circular/squircle mask cannot crop the lettering or the artwork.
          fg_sizes = {'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}
          for density, canvas_size in fg_sizes.items():
              folder = base / f'mipmap-{density}'
              fg = Image.new('RGBA', (canvas_size, canvas_size), (0,0,0,0))
              safe = round(canvas_size * 2 / 3)
              art = source.resize((safe,safe), Image.Resampling.LANCZOS)
              fg.alpha_composite(art, ((canvas_size-safe)//2, (canvas_size-safe)//2))
              fg.save(folder/'ic_launcher_foreground.png', optimize=True)
          # Solid background matches the dark teal background in the supplied image.
          values = base / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values/'ic_launcher_background.xml').write_text(
              '<resources><color name="ic_launcher_background">#071F20</color></resources>',
              encoding='utf-8')
          adaptive = base / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''
          (adaptive/'ic_launcher.xml').write_text(xml, encoding='utf-8')
          (adaptive/'ic_launcher_round.xml').write_text(xml, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mauricio-financas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
