name: Build APK - Mauricio Financas

on:
  workflow_dispatch:
  push:
    branches: [mauricio-financas-ajustes]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('mauricio-financas.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Prepare Capacitor Android project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp mauricio-financas.html www/index.html
          npx cap init "Maurício Finanças" com.mauricio.financas --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 23/' android/variables.gradle

      - name: Apply supplied app icon when available
        run: |
          if [ -f mauricio-financas-3d.png ]; then
            python -m pip install --quiet pillow
            python -c "from PIL import Image; from pathlib import Path; src=Image.open('mauricio-financas-3d.png').convert('RGBA'); base=Path('android/app/src/main/res'); [(base/f'mipmap-{d}').mkdir(parents=True,exist_ok=True) for d in ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']]; [(src.resize((s,s),Image.Resampling.LANCZOS).save(base/f'mipmap-{d}'/'ic_launcher.png',optimize=True),src.resize((s,s),Image.Resampling.LANCZOS).save(base/f'mipmap-{d}'/'ic_launcher_round.png',optimize=True)) for d,s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]]"
          else
            echo "Custom icon file not present in repository; using Capacitor default icon."
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mauricio-financas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
