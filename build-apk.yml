name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar projeto Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp mauricio-financas.html www/index.html
          npx cap init "Minhas Finanças" com.minhasfinancas.app --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's/minSdkVersion = .*/minSdkVersion = 33/' android/variables.gradle

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: minhas-financas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
